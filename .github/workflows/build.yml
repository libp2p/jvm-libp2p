name: build
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'funding.json'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'funding.json'
      - '.github/ISSUE_TEMPLATE/**'
jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
      - name: Install and run ipfs
        run: ./install-run-ipfs.sh

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: 8512546
          # Default packages include the deprecated 'tools' package, which Google removed and
          # sdkmanager can no longer install; keep only platform-tools.
          packages: platform-tools

      - name: Execute Gradle build
        run: ./gradlew -s build dokkaJar